[package]
name = "job-search-workbench"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "个人求职工作台"

[lib]
name = "job_search_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = "0.22"
regex = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSError", "NSData", "NSString", "NSGeometry", "NSNotification"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPDFConfiguration", "WKSnapshotConfiguration", "WKNavigation", "WKNavigationDelegate", "WKFrameInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }
block2 = "0.6"

[dev-dependencies]
tempfile = { workspace = true }
